[project]
name = "roly-poly-toy-generator-backend"
version = "0.0.1"
description = "Backend for the roly-poly toy design explorer (pre-prototype)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "trimesh>=4.4",
    "pygltflib>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.workspace]
members = []
