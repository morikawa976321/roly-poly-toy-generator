name: verify-generated-types

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps (for OpenAPI export)
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" \
            "numpy>=1.26" \
            "pydantic>=2.7" \
            "scipy>=1.11" \
            "python-dotenv>=1.0"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install deploy deps
        working-directory: deploy
        run: npm ci

      - name: Verify deploy derive sync
        run: |
          npm --prefix deploy run sync-core
          git diff --exit-code deploy/src/derive

      - name: Build frontend (SPA routes in OpenAPI need dist/index.html)
        working-directory: frontend
        run: npm run build

      - name: Generate OpenAPI and TS types
        run: |
          python backend/scripts/export_openapi.py frontend/src/generated/openapi.json
          cd frontend
          npx openapi-typescript ./src/generated/openapi.json -o ./src/generated/api-schema.ts

      - name: Verify no uncommitted changes
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

